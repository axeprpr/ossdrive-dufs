name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: mkdir -p backend/web/dist && cp -a dist/. backend/web/dist/
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -C backend -trimpath -ldflags='-s -w' -o "../dist/ossdrive-${GOOS}-${GOARCH}" .
          tar -C dist -czf "dist/ossdrive-${GOOS}-${GOARCH}.tar.gz" "ossdrive-${GOOS}-${GOARCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: ossdrive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.goarch == 'amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz --generate-notes || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ossdrive-dufs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
