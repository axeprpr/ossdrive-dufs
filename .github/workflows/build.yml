name: Build Rust Dufs with OSS support

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: DUFS_EMBED_FILENAME=1 npm run build
      - run: mkdir -p assets && cp dist/index.css assets/index.css && cp dist/index.html assets/index.html && cp dist/index.js assets/index.js
      - uses: actions/upload-artifact@v4
        with:
          name: dufs-assets
          path: assets

  build:
    needs: build-assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dufs-assets
          path: assets
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --locked --release --target=${{ matrix.target }}
      - run: tar -C target/${{ matrix.target }}/release -czf dufs-${{ matrix.target }}.tar.gz dufs
      - uses: actions/upload-artifact@v4
        with:
          name: dufs-${{ matrix.target }}
          path: dufs-${{ matrix.target }}.tar.gz

  docker:
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dufs-assets
          path: assets
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ossdrive-dufs:latest
